<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Power of i</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="screen-1">
        <button class="main-btn" onclick="openCalculator('power_of_i', 'The Power of i')">the power of i</button>
    </div>

    <div id="screen-2">
        <div class="terminal-header">
            <button class="back-btn" onclick="goBack()">⬅ Back</button>
            <div id="mode-title">Mode initialized...</div>
        </div>
        <div class="chat-container" id="chat-box"></div>
        <div class="input-container">
            <input type="text" id="math-input" placeholder="Enter exponent (e.g., 4)... and press Enter" autocomplete="off">
        </div>
    </div>

    <script src="math.js"></script>
</body>
</html>
